services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment secrets}
      POSTGRES_DB: ${POSTGRES_DB:-sports_data}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sports_data}"]
      interval: 5s
      timeout: 5s
      retries: 5

  dragonfly:
    # Service name kept as "dragonfly" so REDIS_URL values stay valid.
    # The dragonfly :latest image became unusable in this stack (its redis-cli
    # health probe can no longer pass and dependents were blocked), so the cache
    # runs on the proven redis:7 image. The old volume is reused; stale dragonfly
    # files are ignored by redis.
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--dir", "/data"]
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["sh", "-c", "node scripts/db-migrate.js && node apps/api/dist/main.js"]
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment secrets}@postgres:5432/${POSTGRES_DB:-sports_data}
      REDIS_URL: redis://dragonfly:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_ENABLED: "true"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set a random AUTH_JWT_SECRET of at least 32 characters}
      AUTH_COOKIE_NAME: betify_auth
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-86400}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set the deployed frontend origin}
      MOCK_PROVIDER_ENABLED: "false"
      APIFOOTBALL_COM_ENABLED: ${APIFOOTBALL_COM_ENABLED:-false}
      APIFOOTBALL_COM_API_KEY: ${APIFOOTBALL_COM_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AUTH_PASSWORD_RESET_FROM_EMAIL: ${AUTH_PASSWORD_RESET_FROM_EMAIL:-}
      AUTH_PASSWORD_RESET_URL_BASE: ${AUTH_PASSWORD_RESET_URL_BASE:-}
      AUTH_PASSWORD_RESET_TTL_MINUTES: ${AUTH_PASSWORD_RESET_TTL_MINUTES:-60}
    expose:
      - "3000"
    ports:
      - "${API_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_started

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    expose:
      - "80"
    ports:
      - "${DASHBOARD_PORT:-3080}:80"
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "apps/worker/dist/main.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment secrets}@postgres:5432/${POSTGRES_DB:-sports_data}
      REDIS_URL: redis://dragonfly:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      MOCK_PROVIDER_ENABLED: "false"
      AUTH_ENABLED: "true"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set a random AUTH_JWT_SECRET of at least 32 characters}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set the deployed frontend origin}
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_started

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "apps/scheduler/dist/main.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment secrets}@postgres:5432/${POSTGRES_DB:-sports_data}
      REDIS_URL: redis://dragonfly:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SCHEDULER_TICK_CRON: ${SCHEDULER_TICK_CRON:-*/15 * * * *}
      CLEANUP_CRON: ${CLEANUP_CRON:-0 3 * * *}
      MOCK_PROVIDER_ENABLED: "false"
      AUTH_ENABLED: "true"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set a random AUTH_JWT_SECRET of at least 32 characters}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set the deployed frontend origin}
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_started

  analytics:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 120s
    command: ["node", "scripts/analytics-daily-service.mjs"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment secrets}@postgres:5432/${POSTGRES_DB:-sports_data}
      REDIS_URL: redis://dragonfly:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_EXECUTION_TARGET: local
      AUTH_ENABLED: "true"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set a random AUTH_JWT_SECRET of at least 32 characters}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set the deployed frontend origin}
      # v2 volume: one-time analytics bootstrap after the history backfill.
      ANALYTICS_STATE_DIR: /var/lib/skoriq-analytics-v2
      TZ: Europe/Istanbul
    volumes:
      - analytics_state_v2:/var/lib/skoriq-analytics-v2
    depends_on:
      postgres:
        condition: service_healthy

  sync:
    build:
      context: .
      dockerfile: Dockerfile.sync
    restart: unless-stopped
    stop_grace_period: 140s
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment secrets}@postgres:5432/${POSTGRES_DB:-sports_data}
      SYNC_EXECUTE: ${SYNC_EXECUTE:-0}
      SYNC_FINISHED_INTERVAL_MINUTES: ${SYNC_FINISHED_INTERVAL_MINUTES:-180}
      SYNC_HISTORY_INTERVAL_MINUTES: ${SYNC_HISTORY_INTERVAL_MINUTES:-43200}
      SYNC_TEAM_STATISTICS_INTERVAL_MINUTES: ${SYNC_TEAM_STATISTICS_INTERVAL_MINUTES:-10080}
      ALLOW_PRODUCTION_TEAM_STATISTICS: "true"
      ALLOW_PRODUCTION_LOCAL_DB: "true"
      SYNC_STATE_DIR: /var/lib/skoriq-sync
      SYNC_CAPTURE_DIR: /tmp/skoriq-sync-captures
      TZ: Europe/Istanbul
    volumes:
      - sync_state:/var/lib/skoriq-sync
    depends_on:
      postgres:
        condition: service_healthy

  match-statistics:
    build:
      context: .
      dockerfile: Dockerfile.sync
    restart: unless-stopped
    stop_grace_period: 120s
    command: ["node", "scripts/match-statistics-service.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment secrets}@postgres:5432/${POSTGRES_DB:-sports_data}
      MATCH_STATISTICS_STATE_DIR: /var/lib/skoriq-match-statistics
      MATCH_STATISTICS_INTERVAL_MINUTES: ${MATCH_STATISTICS_INTERVAL_MINUTES:-60}
      MATCH_STATISTICS_BATCH_LIMIT: ${MATCH_STATISTICS_BATCH_LIMIT:-40}
      MATCH_STATISTICS_LOOKBACK_DAYS: ${MATCH_STATISTICS_LOOKBACK_DAYS:-120}
      PYTHON_BIN: python3
      TZ: Europe/Istanbul
    volumes:
      - match_statistics_state:/var/lib/skoriq-match-statistics
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  dragonfly_data:
  sync_state:
  analytics_state_v2:
  match_statistics_state:
