services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_DB: ${POSTGRES_DB:-sports_data}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sports_data}"]
      interval: 5s
      timeout: 5s
      retries: 5

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:latest
    restart: unless-stopped
    command: ["dragonfly", "--cache_mode=true", "--dir=/data"]
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  db-migrate:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    command: ["npx", "tsx", "scripts/db-migrate.ts"]
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-sports_data}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "apps/api/dist/main.js"]
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-sports_data}
      REDIS_URL: redis://dragonfly:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_ENABLED: "true"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-change_this_jwt_secret_in_coolify}
      AUTH_COOKIE_NAME: betify_auth
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-86400}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:5173}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:5173}
      MOCK_PROVIDER_ENABLED: "false"
      APIFOOTBALL_COM_ENABLED: ${APIFOOTBALL_COM_ENABLED:-false}
      APIFOOTBALL_COM_API_KEY: ${APIFOOTBALL_COM_API_KEY:-}
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    ports:
      - "${DASHBOARD_PORT:-80}:80"
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "apps/worker/dist/main.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-sports_data}
      REDIS_URL: redis://dragonfly:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      MOCK_PROVIDER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "apps/scheduler/dist/main.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/${POSTGRES_DB:-sports_data}
      REDIS_URL: redis://dragonfly:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SCHEDULER_TICK_CRON: ${SCHEDULER_TICK_CRON:-*/15 * * * *}
      CLEANUP_CRON: ${CLEANUP_CRON:-0 3 * * *}
      MOCK_PROVIDER_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
  dragonfly_data:
