services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment secrets}
      POSTGRES_DB: ${POSTGRES_DB:-sports_data}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-sports_data}"]
      interval: 5s
      timeout: 5s
      retries: 5

  dragonfly:
    # Service name kept as "dragonfly" so REDIS_URL values stay valid.
    # The dragonfly :latest image became unusable in this stack (its redis-cli
    # health probe can no longer pass and dependents were blocked), so the cache
    # runs on the proven redis:7 image. The old volume is reused; stale dragonfly
    # files are ignored by redis.
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--dir", "/data"]
    volumes:
      - dragonfly_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["sh", "-c", "node scripts/db-migrate.js && node apps/api/dist/main.js"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health/ready').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    environment:
      NODE_ENV: production
      API_PORT: 3000
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment secrets}@postgres:5432/${POSTGRES_DB:-sports_data}
      REDIS_URL: redis://dragonfly:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_ENABLED: "true"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set a random AUTH_JWT_SECRET of at least 32 characters}
      AUTH_COOKIE_NAME: betify_auth
      RC_PREMATCH_ENABLED: ${RC_PREMATCH_ENABLED:-true}
      AUTH_TOKEN_TTL_SECONDS: ${AUTH_TOKEN_TTL_SECONDS:-86400}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set the deployed frontend origin}
      MOCK_PROVIDER_ENABLED: "false"
      APIFOOTBALL_COM_ENABLED: ${APIFOOTBALL_COM_ENABLED:-false}
      APIFOOTBALL_COM_API_KEY: ${APIFOOTBALL_COM_API_KEY:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      AUTH_PASSWORD_RESET_FROM_EMAIL: ${AUTH_PASSWORD_RESET_FROM_EMAIL:-}
      AUTH_PASSWORD_RESET_URL_BASE: ${AUTH_PASSWORD_RESET_URL_BASE:-}
      AUTH_PASSWORD_RESET_TTL_MINUTES: ${AUTH_PASSWORD_RESET_TTL_MINUTES:-60}
    expose:
      - "3000"
    ports:
      - "${API_PORT:-3001}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_started

  dashboard:
    build:
      context: .
      dockerfile: apps/dashboard/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    expose:
      - "80"
    ports:
      - "${DASHBOARD_PORT:-3080}:80"
    depends_on:
      - api

  worker:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "apps/worker/dist/main.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment secrets}@postgres:5432/${POSTGRES_DB:-sports_data}
      REDIS_URL: redis://dragonfly:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      MOCK_PROVIDER_ENABLED: "false"
      AUTH_ENABLED: "true"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set a random AUTH_JWT_SECRET of at least 32 characters}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set the deployed frontend origin}
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_started

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    command: ["node", "apps/scheduler/dist/main.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment secrets}@postgres:5432/${POSTGRES_DB:-sports_data}
      REDIS_URL: redis://dragonfly:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SCHEDULER_TICK_CRON: ${SCHEDULER_TICK_CRON:-*/15 * * * *}
      CLEANUP_CRON: ${CLEANUP_CRON:-0 3 * * *}
      MOCK_PROVIDER_ENABLED: "false"
      AUTH_ENABLED: "true"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set a random AUTH_JWT_SECRET of at least 32 characters}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set the deployed frontend origin}
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_started

  analytics:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 120s
    command: ["node", "scripts/analytics-daily-service.mjs"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment secrets}@postgres:5432/${POSTGRES_DB:-sports_data}
      REDIS_URL: redis://dragonfly:6379
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_EXECUTION_TARGET: local
      RC_PREMATCH_ENABLED: ${RC_PREMATCH_ENABLED:-true}
      AUTH_ENABLED: "true"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set a random AUTH_JWT_SECRET of at least 32 characters}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set the deployed frontend origin}
      # v4 volume: fresh bootstrap after the Tork (BTTS) engine rollout so the
      # daily jobs (finished-sync, rc/h1 prematch, settlement) run once at
      # startup instead of waiting for the next 09:xx window.
      ANALYTICS_STATE_DIR: /var/lib/skoriq-analytics-v4
      MOCK_PROVIDER_ENABLED: "false"
      APIFOOTBALL_COM_ENABLED: ${APIFOOTBALL_COM_ENABLED:-false}
      APIFOOTBALL_COM_API_KEY: ${APIFOOTBALL_COM_API_KEY:-}
      TZ: Europe/Istanbul
    volumes:
      - analytics_state_v4:/var/lib/skoriq-analytics-v4
    depends_on:
      postgres:
        condition: service_healthy

  sync:
    build:
      context: .
      dockerfile: Dockerfile.sync
    restart: unless-stopped
    stop_grace_period: 140s
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment secrets}@postgres:5432/${POSTGRES_DB:-sports_data}
      SYNC_EXECUTE: ${SYNC_EXECUTE:-1}
      SYNC_FINISHED_INTERVAL_MINUTES: ${SYNC_FINISHED_INTERVAL_MINUTES:-180}
      SYNC_HISTORY_INTERVAL_MINUTES: ${SYNC_HISTORY_INTERVAL_MINUTES:-43200}
      SYNC_TEAM_STATISTICS_INTERVAL_MINUTES: ${SYNC_TEAM_STATISTICS_INTERVAL_MINUTES:-10080}
      ALLOW_PRODUCTION_TEAM_STATISTICS: "true"
      ALLOW_PRODUCTION_LOCAL_DB: "true"
      SYNC_STATE_DIR: /var/lib/skoriq-sync
      SYNC_CAPTURE_DIR: /tmp/skoriq-sync-captures
      TZ: Europe/Istanbul
    volumes:
      - sync_state_v2:/var/lib/skoriq-sync
    depends_on:
      postgres:
        condition: service_healthy

  match-statistics:
    build:
      context: .
      dockerfile: Dockerfile.sync
    restart: unless-stopped
    stop_grace_period: 120s
    command: ["node", "scripts/match-statistics-service.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment secrets}@postgres:5432/${POSTGRES_DB:-sports_data}
      MATCH_STATISTICS_STATE_DIR: /var/lib/skoriq-match-statistics
      MATCH_STATISTICS_INTERVAL_MINUTES: ${MATCH_STATISTICS_INTERVAL_MINUTES:-20}
      MATCH_STATISTICS_BATCH_LIMIT: ${MATCH_STATISTICS_BATCH_LIMIT:-100}
      MATCH_STATISTICS_LOOKBACK_DAYS: ${MATCH_STATISTICS_LOOKBACK_DAYS:-120}
      PYTHON_BIN: python3
      TZ: Europe/Istanbul
    volumes:
      - match_statistics_state:/var/lib/skoriq-match-statistics
    depends_on:
      postgres:
        condition: service_healthy

  lineups:
    build:
      context: .
      dockerfile: Dockerfile.sync
    restart: unless-stopped
    stop_grace_period: 120s
    command: ["node", "scripts/lineups-service.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment secrets}@postgres:5432/${POSTGRES_DB:-sports_data}
      LINEUPS_STATE_DIR: /var/lib/skoriq-lineups
      LINEUPS_INTERVAL_MINUTES: ${LINEUPS_INTERVAL_MINUTES:-20}
      LINEUPS_BATCH_LIMIT: ${LINEUPS_BATCH_LIMIT:-100}
      LINEUPS_LOOKBACK_DAYS: ${LINEUPS_LOOKBACK_DAYS:-120}
      PYTHON_BIN: python3
      TZ: Europe/Istanbul
    volumes:
      - lineups_state:/var/lib/skoriq-lineups
    depends_on:
      postgres:
        condition: service_healthy

  historical-backfill-v4:
    build:
      context: .
      dockerfile: Dockerfile.sync
    restart: on-failure:3
    command: ["node", "scripts/historical-backfill-service.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment secrets}@postgres:5432/${POSTGRES_DB:-sports_data}
      HISTORICAL_STATE_DIR: /var/lib/skoriq-historical
      HISTORICAL_SEASONS: ${HISTORICAL_SEASONS:-5}
      HISTORICAL_PAGES: ${HISTORICAL_PAGES:-15}
      HISTORICAL_ROUNDS: "40"
      HISTORICAL_FORCE: ${HISTORICAL_FORCE:-1}
      PYTHON_BIN: python3
      TZ: Europe/Istanbul
    volumes:
      - historical_backfill_state:/var/lib/skoriq-historical
    depends_on:
      postgres:
        condition: service_healthy

  h2h-build-v2:
    build:
      context: .
      dockerfile: Dockerfile
    restart: on-failure:3
    command: ["node", "scripts/h2h-build-service.mjs"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment secrets}@postgres:5432/${POSTGRES_DB:-sports_data}
      DB_EXECUTION_TARGET: local
      ALLOW_PRODUCTION_LOCAL_DB: "true"
      AUTH_ENABLED: "true"
      AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:?Set a random AUTH_JWT_SECRET of at least 32 characters}
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:?Set the deployed frontend origin}
      H2H_STATE_DIR: /var/lib/skoriq-h2h
      H2H_MATCH_LIMIT: ${H2H_MATCH_LIMIT:-100}
      H2H_WINDOW_SIZES: ${H2H_WINDOW_SIZES:-5,10}
      TZ: Europe/Istanbul
    volumes:
      - h2h_build_state:/var/lib/skoriq-h2h
    depends_on:
      postgres:
        condition: service_healthy

  team-mapping-repair:
    build:
      context: .
      dockerfile: Dockerfile.sync
    restart: unless-stopped
    command: ["node", "scripts/team-mapping-repair-service.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment secrets}@postgres:5432/${POSTGRES_DB:-sports_data}
      TEAM_MAPPING_REPAIR_INTERVAL_MINUTES: ${TEAM_MAPPING_REPAIR_INTERVAL_MINUTES:-1440}
      TZ: Europe/Istanbul
    depends_on:
      postgres:
        condition: service_healthy

  ops-monitor:
    build:
      context: .
      dockerfile: Dockerfile.sync
    restart: unless-stopped
    command: ["node", "scripts/ops-monitor.mjs"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment secrets}@postgres:5432/${POSTGRES_DB:-sports_data}
      API_HEALTH_URL: http://api:3000/api/health/ready
      OPS_INTERVAL_SECONDS: ${OPS_INTERVAL_SECONDS:-300}
      OPS_STARTUP_GRACE_SECONDS: ${OPS_STARTUP_GRACE_SECONDS:-90}
      OPS_STATE_DIR: /var/lib/skoriq-ops
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      MIN_TELEMETRY_MATCHES: ${MIN_TELEMETRY_MATCHES:-500}
      MIN_LINEUP_MATCHES: ${MIN_LINEUP_MATCHES:-100}
      TZ: Europe/Istanbul
    volumes:
      - ops_state:/var/lib/skoriq-ops
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

  model-backtest:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    command: ["node_modules/.bin/tsx", "scripts/football-model-backtest.ts", "--limit=1500", "--min-training=800", "--refit-every=50", "--max-predictions=400", "--iterations=400", "--competition-id=cf0e82b7-4528-4612-bc7e-979b89d5b386"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment secrets}@postgres:5432/${POSTGRES_DB:-sports_data}
      TZ: Europe/Istanbul
    depends_on:
      postgres:
        condition: service_healthy

  model-shadow:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    command: ["node_modules/.bin/tsx", "scripts/football-model-shadow.ts", "--window-hours=72", "--min-training=200"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment secrets}@postgres:5432/${POSTGRES_DB:-sports_data}
      TZ: Europe/Istanbul
    depends_on:
      postgres:
        condition: service_healthy

  model-tune:
    build:
      context: .
      dockerfile: Dockerfile
    restart: "no"
    command: ["node_modules/.bin/tsx", "scripts/football-model-tune.ts", "--competition-id=cf0e82b7-4528-4612-bc7e-979b89d5b386", "--limit=2500"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in deployment secrets}@postgres:5432/${POSTGRES_DB:-sports_data}
      TZ: Europe/Istanbul
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  dragonfly_data:
  sync_state_v2:
  analytics_state_v4:
  match_statistics_state:
  lineups_state:
  historical_backfill_state:
  h2h_build_state:
  ops_state:


