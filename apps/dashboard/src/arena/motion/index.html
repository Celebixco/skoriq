<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>SkorIQ — Stadium light ambience</title>
    <script src="assets/gsap.min.js"></script>
    <style>
      * { box-sizing: border-box; }
      html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
      #arena-light { position: absolute; inset: 0; width: 100%; height: 100%; overflow: hidden; container-type: size; isolation: isolate; }
      .clip, .base, .vignette { position: absolute; inset: 0; }
      .clip { overflow: hidden; }
      .base { background: #000; }
      .field { position: absolute; border-radius: 50%; mix-blend-mode: screen; will-change: transform; filter: blur(7cqmin); }
      .field-a { left: 20cqw; top: -20cqh; width: 50cqw; height: 58cqh; background: radial-gradient(ellipse at center, #d19a57a6 0%, #ba7f373d 38%, #0000 72%); }
      .field-b { right: -10cqw; top: -8cqh; width: 60cqw; height: 70cqh; background: radial-gradient(ellipse at center, #f2d6a694 0%, #b7833238 38%, #0000 76%); }
      .field-c { right: 14cqw; bottom: -38cqh; width: 66cqw; height: 64cqh; background: radial-gradient(ellipse at center, #b07d2e59 0%, #7954261f 42%, #0000 76%); }
      .vignette { background: radial-gradient(ellipse at 76% 32%, #0000 16%, #0009 90%); }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-lh4h" id="arena-light" data-composition-id="arena-light" data-start="0" data-duration="6" data-width="1280" data-height="720" data-fps="24">
      <div data-hf-id="hf-tjfe" id="arena-light-clip" class="clip" data-start="0" data-duration="6" data-track-index="0" data-layout-ignore>
        <div data-hf-id="hf-9327" class="base"></div>
        <div data-hf-id="hf-x3n2" class="field field-a"></div>
        <div data-hf-id="hf-t5j1" class="field field-b"></div>
        <div data-hf-id="hf-sdv8" class="field field-c"></div>
        <div data-hf-id="hf-q7bi" class="vignette"></div>
      </div>
    </div>
    <script>
      // Adapted from the registry's aurora-drift primitive: one finite sine
      // cycle gives the render identical endpoint poses for a seamless loop.
      (() => {
        const tau = Math.PI * 2;
        const state = { phase: 0 };
        const paths = [
          { selector: '.field-a', offset: 0, x: 4.6, y: 3.2 },
          { selector: '.field-b', offset: tau / 3, x: 4.1, y: 3.8 },
          { selector: '.field-c', offset: tau * 2 / 3, x: 3.6, y: 3 },
        ];
        function renderPose() {
          const phase = state.phase === tau ? 0 : state.phase;
          paths.forEach((path) => gsap.set(path.selector, {
            x: `${Math.sin(phase + path.offset) * path.x}cqw`,
            y: `${Math.sin(phase + path.offset + Math.PI / 2) * path.y}cqh`,
          }));
        }
        const timeline = gsap.timeline({ paused: true });
        timeline.to(state, { phase: tau, duration: 6, ease: 'none', onUpdate: renderPose }, 0);
        renderPose();
        window.__timelines = window.__timelines || {};
        window.__timelines['arena-light'] = timeline;
      })();
    </script>
  </body>
</html>
