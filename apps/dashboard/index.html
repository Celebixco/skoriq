<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="referrer" content="no-referrer" />
    <meta name="description" content="SkorIQ ile maçları verisiyle oku. Takım formu, gol profili, H2H bağlamı ve riskleri keşfet. Güven skoru kazanma olasılığı değildir." />
    <meta name="theme-color" content="#070B08" />
    <script>
      (() => {
        let theme = "dark";
        try { if (localStorage.getItem("skoriq:theme:v1") === "light") theme = "light"; } catch {}
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = theme;
        document.querySelector('meta[name="theme-color"]').setAttribute("content", theme === "light" ? "#f6f5ef" : "#070b08");
      })();
    </script>
    <title>SkorIQ — Maçı veriyle oku</title>
    <link rel="icon" type="image/svg+xml" href="/favicon-v2.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=Barlow+Condensed:wght@500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
