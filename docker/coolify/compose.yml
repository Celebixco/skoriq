services:
  api:
    build:
      context: ../..
    command: ["node", "apps/api/dist/main.js"]
    environment:
      NODE_ENV: production
      API_PORT: ${API_PORT:-3000}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      MOCK_PROVIDER_ENABLED: "false"
    ports:
      - "${API_PORT:-3000}:3000"
    depends_on:
      - redis

  worker:
    build:
      context: ../..
    command: ["node", "apps/worker/dist/main.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-3}
      MOCK_PROVIDER_ENABLED: "false"
    depends_on:
      - redis

  scheduler:
    build:
      context: ../..
    command: ["node", "apps/scheduler/dist/main.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SCHEDULER_TICK_CRON: ${SCHEDULER_TICK_CRON:-*/15 * * * *}
      CLEANUP_CRON: ${CLEANUP_CRON:-0 3 * * *}
      MOCK_PROVIDER_ENABLED: "false"
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data

volumes:
  redis_data:
