name: Production deploy

on:
  push:
    branches: [release/soft-launch]
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npx vitest run --reporter=dot

      - name: Trigger Coolify deployment
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          COOLIFY_APP_UUID: ${{ secrets.COOLIFY_APP_UUID }}
        run: |
          set -euo pipefail
          response=$(curl -fsS -X POST "$COOLIFY_BASE_URL/api/v1/deploy" \
            -H "Authorization: Bearer $COOLIFY_TOKEN" \
            -H "Content-Type: application/json" \
            --data "{\"uuid\":\"$COOLIFY_APP_UUID\",\"force\":false}")
          deployment_uuid=$(node -e "const d=JSON.parse(process.argv[1]); process.stdout.write(d.deployments?.[0]?.deployment_uuid ?? '')" "$response")
          if [ -z "$deployment_uuid" ]; then
            echo "Coolify did not return a deployment UUID"
            echo "$response"
            exit 1
          fi
          echo "DEPLOYMENT_UUID=$deployment_uuid" >> "$GITHUB_ENV"
          echo "Queued deployment $deployment_uuid"

      - name: Wait for Coolify deployment
        env:
          COOLIFY_BASE_URL: ${{ secrets.COOLIFY_BASE_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 80); do
            response=$(curl -fsS "$COOLIFY_BASE_URL/api/v1/deployments/$DEPLOYMENT_UUID" \
              -H "Authorization: Bearer $COOLIFY_TOKEN" \
              -H "Accept: application/json")
            status=$(node -e "const d=JSON.parse(process.argv[1]); process.stdout.write(String(d.status ?? ''))" "$response")
            echo "deployment status: $status (attempt $attempt)"
            case "$status" in
              finished) exit 0 ;;
              failed|killed|cancelled) echo "$response" | head -c 4000; exit 1 ;;
            esac
            sleep 15
          done
          echo "Deployment did not finish within 20 minutes"
          exit 1

      - name: Health check
        env:
          PRODUCTION_URL: ${{ secrets.PRODUCTION_URL }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 20); do
            if curl -fsS "$PRODUCTION_URL/api/health/ready" >/dev/null; then
              echo "production is ready"
              exit 0
            fi
            echo "health check failed (attempt $attempt)"
            sleep 10
          done
          echo "production health check failed after deployment"
          exit 1
